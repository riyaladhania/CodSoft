<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Calculator | CodSoft Task 3</title>
  <style>
    /* ── RESET ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── PAGE ── */
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #0f0f0f;
      font-family: 'Segoe UI', sans-serif;
    }

    h1 {
      color: #555;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 28px;
    }

    /* ── CALCULATOR SHELL ── */
    .calc {
      width: 320px;
      background: #1c1c1e;
      border-radius: 28px;
      overflow: hidden;
      box-shadow:
        0 40px 80px rgba(0,0,0,0.6),
        0 0 0 1px rgba(255,255,255,0.06);
    }

    /* ── DISPLAY ── */
    .display {
      padding: 28px 24px 18px;
      text-align: right;
      min-height: 120px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 4px;
      background: #1c1c1e;
    }

    .expr {
      font-size: 0.88rem;
      color: #666;
      min-height: 20px;
      word-break: break-all;
      transition: all 0.15s;
    }

    .result {
      font-size: 3rem;
      font-weight: 300;
      color: #ffffff;
      line-height: 1;
      letter-spacing: -0.02em;
      word-break: break-all;
      transition: font-size 0.15s;
    }

    .result.small   { font-size: 2rem; }
    .result.smaller { font-size: 1.5rem; }

    /* ── BUTTON GRID ── */
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1px;
      background: #000;
    }

    /* Base button */
    .btn {
      border: none;
      padding: 0;
      height: 76px;
      font-size: 1.25rem;
      cursor: pointer;
      transition: filter 0.12s, transform 0.08s;
      user-select: none;
      outline: none;
    }

    .btn:active {
      filter: brightness(1.3);
      transform: scale(0.94);
    }

    /* Grey (numbers & dot) */
    .btn-grey {
      background: #2c2c2e;
      color: #ffffff;
    }
    .btn-grey:hover { background: #3a3a3c; }

    /* Dark grey (AC, +/-, %) */
    .btn-dark {
      background: #636366;
      color: #ffffff;
    }
    .btn-dark:hover { background: #7c7c7e; }

    /* Orange (operators) */
    .btn-orange {
      background: #ff9f0a;
      color: #ffffff;
      font-size: 1.5rem;
    }
    .btn-orange:hover { background: #ffb340; }

    /* Orange active state (when operator selected) */
    .btn-orange.active {
      background: #ffffff;
      color: #ff9f0a;
    }

    /* Zero button spans 2 columns */
    .btn-zero {
      grid-column: span 2;
      text-align: left;
      padding-left: 30px;
      font-size: 1.25rem;
    }

    /* ── HISTORY PANEL ── */
    .history-wrap {
      margin-top: 20px;
      width: 320px;
    }

    .history-toggle {
      background: none;
      border: 1px solid #333;
      color: #666;
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 8px 16px;
      border-radius: 99px;
      cursor: pointer;
      display: block;
      margin: 0 auto 12px;
      transition: color 0.2s, border-color 0.2s;
    }
    .history-toggle:hover { color: #ff9f0a; border-color: #ff9f0a; }

    .history-list {
      display: none;
      flex-direction: column;
      gap: 6px;
      max-height: 180px;
      overflow-y: auto;
      padding: 4px 0;
    }
    .history-list.open { display: flex; }

    .history-item {
      background: #1c1c1e;
      border-radius: 10px;
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      transition: background 0.15s;
    }
    .history-item:hover { background: #2c2c2e; }
    .history-item .hi-expr { font-size: 0.78rem; color: #666; }
    .history-item .hi-val  { font-size: 0.92rem; color: #fff; font-weight: 500; }

    .history-empty { text-align: center; color: #444; font-size: 0.82rem; padding: 12px 0; }

    /* ── FOOTER TAG ── */
    .footer-tag {
      margin-top: 24px;
      font-size: 0.7rem;
      color: #333;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>

<h1>CodSoft — Task 3 — Calculator</h1>

<!-- CALCULATOR -->
<div class="calc" role="main" aria-label="Calculator">

  <!-- Display -->
  <div class="display">
    <div class="expr"  id="expr"></div>
    <div class="result" id="result">0</div>
  </div>

  <!-- Buttons -->
  <div class="buttons">

    <!-- Row 1 -->
    <button class="btn btn-dark"   data-action="clear">AC</button>
    <button class="btn btn-dark"   data-action="toggle-sign">+/−</button>
    <button class="btn btn-dark"   data-action="percent">%</button>
    <button class="btn btn-orange" data-action="operator" data-value="÷">÷</button>

    <!-- Row 2 -->
    <button class="btn btn-grey" data-action="digit" data-value="7">7</button>
    <button class="btn btn-grey" data-action="digit" data-value="8">8</button>
    <button class="btn btn-grey" data-action="digit" data-value="9">9</button>
    <button class="btn btn-orange" data-action="operator" data-value="×">×</button>

    <!-- Row 3 -->
    <button class="btn btn-grey" data-action="digit" data-value="4">4</button>
    <button class="btn btn-grey" data-action="digit" data-value="5">5</button>
    <button class="btn btn-grey" data-action="digit" data-value="6">6</button>
    <button class="btn btn-orange" data-action="operator" data-value="−">−</button>

    <!-- Row 4 -->
    <button class="btn btn-grey" data-action="digit" data-value="1">1</button>
    <button class="btn btn-grey" data-action="digit" data-value="2">2</button>
    <button class="btn btn-grey" data-action="digit" data-value="3">3</button>
    <button class="btn btn-orange" data-action="operator" data-value="+">+</button>

    <!-- Row 5 -->
    <button class="btn btn-grey btn-zero" data-action="digit" data-value="0">0</button>
    <button class="btn btn-grey" data-action="dot">.</button>
    <button class="btn btn-orange" data-action="equals">=</button>

  </div>
</div>

<!-- HISTORY -->
<div class="history-wrap">
  <button class="history-toggle" id="histBtn">▾ Calculation History</button>
  <div class="history-list" id="histList">
    <div class="history-empty" id="histEmpty">No calculations yet.</div>
  </div>
</div>

<div class="footer-tag">#codsoft #webdevelopment #internship</div>

<!-- ── JAVASCRIPT ── -->
<script>
  /*
   * CALCULATOR STATE
   * currentVal  — number being typed right now
   * prevVal     — number before the operator
   * operator    — current operator (+, −, ×, ÷)
   * justEvaled  — did we just press = ?
   * history     — array of past calculations
   */
  let currentVal  = '0';
  let prevVal     = '';
  let operator    = null;
  let justEvaled  = false;
  let history     = [];

  // ── DOM refs ──
  const resultEl = document.getElementById('result');
  const exprEl   = document.getElementById('expr');
  const histList = document.getElementById('histList');
  const histEmpty= document.getElementById('histEmpty');
  const histBtn  = document.getElementById('histBtn');

  // ── Update the display ──
  function updateDisplay() {
    resultEl.textContent = currentVal;

    // Shrink text if number is long
    const len = currentVal.length;
    resultEl.className = 'result';
    if (len > 9)  resultEl.classList.add('smaller');
    else if (len > 6) resultEl.classList.add('small');

    // Highlight active operator button
    document.querySelectorAll('.btn-orange').forEach(b => b.classList.remove('active'));
    if (operator && !justEvaled) {
      document.querySelectorAll('[data-value]').forEach(b => {
        if (b.dataset.value === operator) b.classList.add('active');
      });
    }
  }

  // ── Handle a digit press ──
  function handleDigit(val) {
    // Limit to 12 digits
    if (currentVal.replace('-','').replace('.','').length >= 12) return;

    if (justEvaled) {
      currentVal = val;
      justEvaled = false;
    } else {
      currentVal = currentVal === '0' ? val : currentVal + val;
    }
    updateDisplay();
  }

  // ── Handle decimal point ──
  function handleDot() {
    if (justEvaled) { currentVal = '0.'; justEvaled = false; updateDisplay(); return; }
    if (!currentVal.includes('.')) {
      currentVal += '.';
      updateDisplay();
    }
  }

  // ── Handle AC (All Clear) ──
  function handleClear() {
    currentVal = '0';
    prevVal    = '';
    operator   = null;
    justEvaled = false;
    exprEl.textContent = '';
    updateDisplay();
    document.querySelectorAll('.btn-orange').forEach(b => b.classList.remove('active'));
  }

  // ── Handle +/− (toggle sign) ──
  function handleToggleSign() {
    if (currentVal === '0') return;
    currentVal = currentVal.startsWith('-')
      ? currentVal.slice(1)
      : '-' + currentVal;
    updateDisplay();
  }

  // ── Handle % ──
  function handlePercent() {
    currentVal = String(parseFloat(currentVal) / 100);
    updateDisplay();
  }

  // ── Handle operator press ──
  function handleOperator(op) {
    // If there's a pending operation and user types new op, calculate first
    if (operator && !justEvaled && prevVal !== '') {
      handleEquals(true); // silent equals
    }
    prevVal    = currentVal;
    operator   = op;
    justEvaled = false;
    exprEl.textContent = prevVal + ' ' + op;
    updateDisplay();
  }

  // ── Core maths ──
  function calculate(a, b, op) {
    a = parseFloat(a);
    b = parseFloat(b);
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 'Error' : a / b;
      default:  return b;
    }
  }

  // ── Handle = ──
  function handleEquals(silent = false) {
    if (!operator || prevVal === '') return;

    const a = prevVal;
    const b = currentVal;
    const raw = calculate(a, b, operator);

    // Format result — avoid floating-point weirdness
    let formatted;
    if (raw === 'Error') {
      formatted = 'Error';
    } else {
      // Round to max 10 decimal places to avoid 0.1+0.2 = 0.30000000004
      formatted = String(parseFloat(raw.toFixed(10)));
    }

    const expression = a + ' ' + operator + ' ' + b + ' =';

    if (!silent) {
      exprEl.textContent  = expression;
      currentVal          = formatted;
      prevVal             = '';
      operator            = null;
      justEvaled          = true;

      // Save to history
      addHistory(expression, formatted);
      updateDisplay();
    } else {
      // Used when chaining operators — keep result as new prevVal
      currentVal = formatted;
      prevVal    = '';
      justEvaled = false;
    }
  }

  // ── History ──
  function addHistory(expr, val) {
    history.unshift({ expr, val });
    if (history.length > 20) history.pop();
    renderHistory();
  }

  function renderHistory() {
    histEmpty.style.display = history.length === 0 ? 'block' : 'none';

    // Remove old items (keep empty msg)
    const items = histList.querySelectorAll('.history-item');
    items.forEach(i => i.remove());

    history.forEach(h => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `<span class="hi-expr">${h.expr}</span><span class="hi-val">${h.val}</span>`;
      // Click to restore value
      div.addEventListener('click', () => {
        currentVal = h.val;
        justEvaled = true;
        updateDisplay();
      });
      histList.appendChild(div);
    });
  }

  // Toggle history panel
  histBtn.addEventListener('click', () => {
    histList.classList.toggle('open');
    histBtn.textContent = histList.classList.contains('open')
      ? '▴ Calculation History'
      : '▾ Calculation History';
  });

  // ── Main button click handler ──
  document.querySelector('.buttons').addEventListener('click', (e) => {
    const btn = e.target.closest('.btn');
    if (!btn) return;

    const action = btn.dataset.action;
    const value  = btn.dataset.value;

    switch (action) {
      case 'digit':       handleDigit(value);     break;
      case 'dot':         handleDot();            break;
      case 'clear':       handleClear();          break;
      case 'toggle-sign': handleToggleSign();     break;
      case 'percent':     handlePercent();        break;
      case 'operator':    handleOperator(value);  break;
      case 'equals':      handleEquals();         break;
    }
  });

  // ── Keyboard support ──
  document.addEventListener('keydown', (e) => {
    if (e.key >= '0' && e.key <= '9') handleDigit(e.key);
    else if (e.key === '.')           handleDot();
    else if (e.key === '+')           handleOperator('+');
    else if (e.key === '-')           handleOperator('−');
    else if (e.key === '*')           handleOperator('×');
    else if (e.key === '/')         { e.preventDefault(); handleOperator('÷'); }
    else if (e.key === 'Enter' || e.key === '=') handleEquals();
    else if (e.key === 'Backspace') {
      if (currentVal.length > 1) currentVal = currentVal.slice(0,-1);
      else currentVal = '0';
      updateDisplay();
    }
    else if (e.key === 'Escape') handleClear();
    else if (e.key === '%')      handlePercent();
  });

  // Init
  updateDisplay();
</script>
</body>
</html>
